name: Release

# Pushing a tag like v0.1.0 builds, signs, notarizes and staples Clipback, then attaches the DMG to a GitHub
# Release. The tag must match CFBundleShortVersionString in Resources/Info.plist, optionally with a suffix:
# v0.1.0-rc1 makes a pre-release, to try the whole pipeline before the real tag. Delete it afterwards with
#   gh release delete v0.1.0-rc1 --cleanup-tag --yes
#
# Repository secrets it needs:
#   DEVELOPER_ID_P12_BASE64    the "Developer ID Application" certificate and key, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password set when exporting it
#   NOTARY_KEY_P8_BASE64       an App Store Connect API key (.p8, "Developer" role), base64
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown above the keys table in App Store Connect
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'kb14/clipback'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          case "$GITHUB_REF_NAME" in
            "v$VERSION" | "v$VERSION"-*) ;;
            *) echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION"; exit 1 ;;
          esac

      - name: Import the signing certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          ./scripts/release.sh
          rm "$NOTARY_KEY_PATH"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Clipback ${GITHUB_REF_NAME#v}" --generate-notes $PRERELEASE
